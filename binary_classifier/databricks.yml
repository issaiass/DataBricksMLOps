# Adult income binary classifier — bundle entry point.
# Catalogs, schemas, tables, and model names are variables only.
# Alias protocol literals: dev / challenger / champion / prod.
#
# Layout:
#   resources/variables/  bundle variables (UC, quality, compute, identities, naming, paths)
#   resources/shared/     UC objects + jobs on both targets (batch, monitor, features, cleanup)
#   resources/dev/        train job (dev target only)
#   resources/prod/       promotion_gate + promotion_cutover (prod target only)
bundle:
  name: adult-income-binary
  uuid: 7e2c1a90-4b6d-4f1a-9c3e-adult-income-01

include:
  - resources/variables/*.yml
  - resources/shared/*.yml
  - resources/dev/*.yml
  - resources/prod/*.yml

targets:
  dev:
    default: true
    # Keep schedules paused. Do not use mode: development — it prefixes UC
    # registered model FQNs (dev_user_ml_dev.schema.model), which is invalid.
    presets:
      trigger_pause_status: PAUSED
    workspace:
      file_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ${var.dev_catalog}
      source_model_name: ${var.dev_catalog}.${var.schema}.${var.model_name}
      dest_model_name: ${var.prod_catalog}.${var.schema}.${var.model_name}
      experiment_path: ${var.dev_experiment_path}
      evaluate_mode: dev
      batch_alias: dev
      endpoint_name: adult-income-clf-dev
      online_store_name: adult-income-ofs-dev
      online_catalog: ${var.dev_catalog}
    sync:
      include:
        - notebooks/n01_dev_train/**
        - notebooks/n04_ops/**
        - src/**
        - data/**
        - pyproject.toml
    # Train / EDA / XAI / Compare / promotion_ready / smoke live in resources/dev/

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.job_run_as_sp}
    variables:
      catalog: ${var.prod_catalog}
      source_model_name: ${var.dev_catalog}.${var.schema}.${var.model_name}
      dest_model_name: ${var.prod_catalog}.${var.schema}.${var.model_name}
      experiment_path: ${var.prod_experiment_path}
      evaluate_mode: prod_gate
      batch_alias: prod
      endpoint_name: adult-income-clf-prod
      online_store_name: adult-income-ofs-prod
      online_catalog: ${var.prod_catalog}
    sync:
      include:
        - notebooks/n02_prod_gate/**
        - notebooks/n03_prod_cutover/**
        - notebooks/n04_ops/**
        - notebooks/n01_dev_train/n01_seed*
        - notebooks/n01_dev_train/n02_data_checks*
        - notebooks/n01_dev_train/n04_features*
        - notebooks/n01_dev_train/n06_evaluate*
        - src/**
        - data/**
        - pyproject.toml
    # promotion_gate / promotion_cutover live in resources/prod/ — never on dev
