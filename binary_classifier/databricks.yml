  approver_group:
    default: mlops-approvers
  approver_identities:
    description: Comma-separated emails or SP application IDs allowed to tag Approved
    default: REPLACE_ME_APPROVER@example.com
  dataset_shortname:
    description: Dataset label in Jobs UI ([<target> <user>] <dataset>-<model>-<job-type>)
    default: adult
  job_user_shortname:
