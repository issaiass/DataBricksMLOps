bundle:
  name: adult-income-binary
  uuid: 7e2c1a90-4b6d-4f1a-9c3e-adult-income-01

include:
  - resources/shared/*.yml
  - resources/dev/*.yml
  - resources/prod/*.yml

# Catalogs, schemas, tables, and model names are variables only.
# Alias protocol literals: dev / challenger / champion / prod.
variables:
  dev_catalog:
    description: Unity Catalog for training and the source registered model
    default: ml_dev
  prod_catalog:
    description: Unity Catalog for the dest registered model and prod scoring
    default: ml_prod
  catalog:
    description: Active catalog for this bundle target (never a job parameter)
    default: ml_dev
  schema:
    description: Schema for this example
    default: adult_income
  model_name:
    description: Registered model name (unqualified)
    default: adult_income_clf
  source_model_name:
    description: Fully qualified source model (ml_dev)
    default: ml_dev.adult_income.adult_income_clf
  dest_model_name:
    description: Fully qualified dest model (ml_prod)
    default: ml_prod.adult_income.adult_income_clf
  raw_table:
    default: adult_raw
  feature_table:
    default: adult_features
  label_table:
    default: adult_labels
  predictions_table:
    default: adult_predictions
  inference_table:
    default: adult_inference_logs
  eda_profile_table:
    default: adult_eda_profile
  xai_explanation_table:
    default: adult_xai
  monitor_status_table:
    default: adult_monitor_status
  label_col:
    default: income_gt_50k
  id_col:
    default: row_id
  event_time_col:
    description: Empty = no time-based split (Adult has no event time)
    default: ""
  compare_metric:
    default: roc_auc
  compare_higher_is_better:
    default: "true"
  compare_margin:
    default: "0.0"
  min_eval_rows:
    default: "200"
  min_table_rows:
    default: "200"
  max_null_rate:
    default: "0.4"
  label_window:
    default: "P365D"
  eval_min_roc_auc:
    default: "0.70"
  train_seed:
    default: "42"
  allow_champion_fallback:
    description: Baked into task env only. Default refuse empty CI pins.
    default: "false"
  allow_canary:
    default: "false"
  canary_percent:
    default: "10"
  canary_warmup_s:
    default: "120"
  endpoint_name:
    default: adult-income-clf
  env_manager:
    default: local
  # Compute: serverless (environment_key=ml_env). This workspace is serverless-only:
  # do not attach job_clusters / job_cluster_key on deployable jobs (API 400).
  # Classic vars remain for workspaces that allow classic job clusters.
  compute_mode:
    description: serverless (default) or classic. Pair with env_key / cluster_key.
    default: serverless
  classic_node_type_id:
    description: Classic job-cluster node type (AWS general purpose)
    default: r5d.2xlarge
  classic_spark_version:
    default: 15.4.x-cpu-ml-scala2.12
  classic_min_workers:
    description: Classic cluster min workers (not single-node). Default 3; keep in 3-6.
    default: "3"
  classic_max_workers:
    description: Classic cluster max workers (autoscale). Default 6; keep in 3-6.
    default: "6"
  classic_data_security_mode:
    default: SINGLE_USER
  env_key:
    description: Serverless environment key. Empty when using classic_ml.
    default: ml_env
  cluster_key:
    description: Job cluster key. Empty for serverless. Set classic_ml for classic.
    default: ""
