[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adult-income-mlops"
version = "0.1.0"
description = "UCI Adult Census Income binary classifier bundle"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
